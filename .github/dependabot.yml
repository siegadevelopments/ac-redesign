version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (tracked for 7.1),
      # so linting breaks on it. Remove this when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types should match the Node version we run (22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
